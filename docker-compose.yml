services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mkl
      POSTGRES_PASSWORD: mkl
      POSTGRES_DB: mkl
    # No host port: the database is reachable only from the compose network.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkl"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://mkl:mkl@db:5432/mkl
      APP_ENV: docker
      LOG_LEVEL: INFO
    # No host port: all traffic goes through the TLS proxy.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build: ./proxy
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - proxy_certs:/etc/nginx/certs
    depends_on:
      - app

volumes:
  db_data:
  proxy_certs:

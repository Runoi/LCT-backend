services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mkl
      POSTGRES_PASSWORD: mkl
      POSTGRES_DB: mkl
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkl"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://mkl:mkl@db:5432/mkl
      APP_ENV: docker
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
